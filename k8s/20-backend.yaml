apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: velara
  labels: { app: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: velara/backend:latest # replace with your registry image
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef: { name: velara-config }
            - secretRef: { name: velara-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "150m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: velara
spec:
  selector: { app: backend }
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: velara
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
