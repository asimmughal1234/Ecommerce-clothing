# Copy this file to 01-secrets.yaml, fill in real values, and DO NOT commit it.
# Or create it imperatively:
#   kubectl create secret generic velara-secrets -n velara \
#     --from-literal=POSTGRES_USER=velara \
#     --from-literal=POSTGRES_PASSWORD=change-me \
#     --from-literal=DATABASE_URL=postgresql://velara:change-me@postgres:5432/velara_db?schema=public \
#     --from-literal=JWT_SECRET=change-me-to-a-long-random-string \
#     --from-literal=STRIPE_SECRET_KEY=sk_live_xxx \
#     --from-literal=STRIPE_WEBHOOK_SECRET=whsec_xxx
apiVersion: v1
kind: Secret
metadata:
  name: velara-secrets
  namespace: velara
type: Opaque
stringData:
  POSTGRES_USER: velara
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: "postgresql://velara:change-me@postgres:5432/velara_db?schema=public"
  JWT_SECRET: change-me-to-a-long-random-string
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
