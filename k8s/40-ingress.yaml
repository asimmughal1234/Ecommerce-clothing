apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: velara-ingress
  namespace: velara
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - velara.example.com
        - api.velara.example.com
      secretName: velara-tls
  rules:
    - host: velara.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 3000 }
    - host: api.velara.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { number: 4000 }
